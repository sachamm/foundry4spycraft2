version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Let new major versions settle for two weeks before proposing them.
    cooldown:
      semver-major-days: 14
    groups:
      # eslint and @eslint/js must move together: @eslint/js declares a peer dependency on the matching eslint.
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      semver-major-days: 14
    groups:
      github-actions:
        patterns:
          - "*"
