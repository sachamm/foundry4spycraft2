name: Publish Spycraft Release Candidate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spycraft-release-candidate
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TAG: v0.3.1-rc.1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build and run rules regression tests
        run: |
          npm ci
          npm run build
          npm test
      - name: Browser layout regression
        run: |
          npx playwright install --with-deps chromium
          npm run test:layout
      - name: Stamp release-candidate manifest
        run: |
          jq --arg ver "${TAG#v}" \
             --arg base "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" \
             '.version = $ver | .manifest = ($base + "/system.json") | .download = ($base + "/spycraft2.zip")' \
             system.json > system.tmp
          mv system.tmp system.json
          node -e 'const m=require("./system.json");if(m.version!=="0.3.1-rc.1"||!m.download.includes("v0.3.1-rc.1"))process.exit(1)'
      - name: Package and validate archive
        run: |
          zip -r spycraft2.zip system.json spycraft2.mjs module templates styles lang packs assets README.md CHANGELOG.md
          unzip -t spycraft2.zip
          sha256sum spycraft2.zip system.json > SHA256SUMS.txt
      - name: Publish release candidate without replacing stable latest
        run: |
          cat > release-notes.md <<EOF
          Spycraft 2.0 v0.3.1-rc.1 — Release Candidate

          Includes merged rules audit fixes, Foundry 14 compatibility and retro dossier UI.

          Built from main commit ${GITHUB_SHA}. Automated engine, data integrity, sheet, lifecycle and browser-layout tests passed.

          Foundry manifest URL:
          https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/system.json

          This is a prerelease. Back up your worlds and system before updating. Uses the same Foundry system ID, spycraft2.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release tag already exists; refusing to overwrite an immutable release candidate."
            exit 1
          fi
          gh release create "$TAG" system.json spycraft2.zip SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Spycraft 2.0 v0.3.1-rc.1" \
            --notes-file release-notes.md \
            --prerelease --latest=false
