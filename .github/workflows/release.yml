name: Release

# Publish a GitHub release with a tag like v0.6.1 (or v0.6.1-rc.1 as a prerelease). This workflow runs every
# validation check, confirms the tag, CHANGELOG.md and system.json agree, then attaches system.json, spycraft2.zip
# and checksums so Foundry can install or update from the manifest URL.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/validate.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag, changelog and manifest agree
        run: node tools/check-release.mjs "$GITHUB_REF_NAME"

      - name: Stamp version, download and manifest URLs into system.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          # A prerelease points its manifest at itself, so installing it never replaces the stable "latest" manifest.
          if [ "$PRERELEASE" = "true" ]; then MANIFEST="$BASE/system.json"; else MANIFEST="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/system.json"; fi
          jq --arg v "$VERSION" --arg dl "$BASE/spycraft2.zip" --arg m "$MANIFEST" \
             '.version = $v | .download = $dl | .manifest = $m' system.json > system.tmp && mv system.tmp system.json

      - name: Build compendium packs
        run: npm ci && npm run build

      - name: Package and verify archive
        run: |
          zip -r spycraft2.zip system.json spycraft2.mjs module templates styles lang packs assets README.md LICENSING.md LICENSES CHANGELOG.md docs/sample-agents.md docs/sample-cast.md
          unzip -t spycraft2.zip
          sha256sum spycraft2.zip system.json > SHA256SUMS.txt

      - name: Upload release assets
        run: gh release upload "$GITHUB_REF_NAME" system.json spycraft2.zip SHA256SUMS.txt --clobber
