name: Validate
# Every check a change must pass. Pull requests and main run it directly; the release workflow calls it before it
# packages anything, so a release can never skip a check that a pull request had to pass.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - name: Generated files are committed and current
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::npm run build changed committed files. Run it locally and commit the result."
            exit 1
          fi
      - run: npm test
      - run: npm run test:packs
      - name: Verify built output parses
        run: |
          find module tools -name '*.mjs' -type f -exec node --check {} \;
          node --check spycraft2.mjs
          node -e 'JSON.parse(require("fs").readFileSync("system.json","utf8"))'
  layout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:layout
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: layout-test-results
          path: test-results/
